<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0080ff"/>
      <stop offset="100%" style="stop-color:#00c2ff"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0f0ff"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Shield Shape -->
  <path d="M256 80 L384 128 L384 256 C384 336 320 392 256 420 C192 392 128 336 128 256 L128 128 Z"
        fill="url(#shieldGrad)"/>

  <!-- Check Mark -->
  <path d="M192 256 L240 304 L320 208"
        fill="none"
        stroke="#0080ff"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
</svg>
