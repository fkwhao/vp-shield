<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2dff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- Shield Shape -->
  <path d="M256 64 L400 128 L400 256 C400 352 320 416 256 448 C192 416 112 352 112 256 L112 128 Z"
        fill="none"
        stroke="url(#shieldGrad)"
        stroke-width="16"
        stroke-linejoin="round"/>

  <!-- Inner Shield -->
  <path d="M256 96 L368 152 L368 256 C368 336 296 384 256 408 C216 384 144 336 144 256 L144 152 Z"
        fill="rgba(0, 240, 255, 0.1)"
        stroke="none"/>

  <!-- Check Mark -->
  <path d="M200 256 L240 296 L312 200"
        fill="none"
        stroke="#00ff88"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Decorative dots -->
  <circle cx="256" cy="128" r="8" fill="#00f0ff"/>
  <circle cx="180" cy="200" r="6" fill="#7b2dff"/>
  <circle cx="332" cy="200" r="6" fill="#7b2dff"/>
  <circle cx="160" cy="300" r="4" fill="#00f0ff" opacity="0.5"/>
  <circle cx="352" cy="300" r="4" fill="#00f0ff" opacity="0.5"/>
</svg>
